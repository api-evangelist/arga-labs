aid: arga-labs
name: Arga Labs
description: >-
  Arga Labs provides testing infrastructure for AI agents and agent-facing
  software. Its platform spins up isolated, resettable sandboxes wired to
  stateful "digital twins" of third-party services — Stripe, Slack, GitHub,
  Salesforce, Notion, Discord, Google Drive, Jira, Box, Dropbox, Gmail, Google
  Calendar and more — so teams can run browser-agent tests, per-PR preview
  environments, and CI validation without hitting real APIs, exhausting rate
  limits, or mutating production data. Developers drive it from a web app, a
  REST API at api.argalabs.com, the arga CLI, official Python and TypeScript
  SDKs, and a hosted MCP server that lets coding agents (Cursor, Claude Code,
  Codex) provision twins and query validation runs directly from the editor.
