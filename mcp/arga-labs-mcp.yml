generated: '2026-07-18'
method: searched
status: published
source: https://docs.argalabs.com/mcp
server:
  name: arga-context
  transport: http
  url: https://api.argalabs.com/mcp
  auth:
    type: bearer
    header: Authorization
    note: Bearer <arga_sk_ API key>. `arga mcp install` writes the entry using the saved CLI credential.
install:
  cli: arga mcp install
  prerequisites:
  - uv tool install arga-cli
  - arga login
  targets:
  - ~/.cursor/mcp.json
  - ~/.claude/mcp.json
  - ~/.config/codex/mcp.json
clients:
- Cursor
- Claude Code
- Codex
tools:
- name: list_connected_sources
  description: List all tool sources the authenticated user has connected.
- name: investigate_bug
  description: Investigate a bug or error by searching all connected sources and tracing the root cause.
- name: search_context
  description: Search for context across connected tools using natural language.
- name: get_source_detail
  description: Fetch a specific record from a connected source by its identifier.
- name: search_github
  description: Search GitHub PRs, issues, and code for the authenticated user.
- name: search_linear
  description: Search Linear issues for the authenticated user.
- name: search_slack
  description: Search Slack messages and threads for the authenticated user.
- name: search_sentry
  description: Search Sentry issues for the authenticated user.
- name: search_grafana
  description: Search Grafana dashboards or alerts for the authenticated user.
- name: search_posthog
  description: Search PostHog exceptions or run a HogQL query for the authenticated user.
- name: create_sandbox_run
  description: 'Create a sandbox run that deploys app code plus selected twins.


    Provide either branch or pr_url. Use the returned sandbox_id with run_test

    or create_test_run via the sandbox_id parameter.'
- name: get_sandbox_run
  description: Get sandbox run status, app URL, twin URLs, and environment variables.
- name: create_twin_run
  description: 'Create a twin run that deploys and optionally seeds one or more twins.


    Use scenario_prompt to generate seed data. Fast is the default; choose thorough

    for complex requirements when a longer wait is acceptable. A scenario_id reuses

    saved seed data and ignores scenario_prompt and scenario_generation_mode.'
- name: get_twin_run
  description: Get twin run status, URLs, env vars, and seed details.
- name: create_test_run
  description: 'Create an ad hoc test run.


    Use sandbox_id to run against a sandbox run. Use pr_url/repo/branch as

    metadata when the test run was triggered by a PR.'
- name: run_test
  description: 'Run a saved test by ID.


    For PR checks, pass pr_url/repo/branch and a ready sandbox_id or start_url.'
- name: get_test_run
  description: Get test run status, events, artifacts, and summary fields.
- name: list_tests
  description: List saved tests, optionally filtered by repository.
- name: start_url_validation
  description: 'Legacy alias: start a browser test run against a deployed URL.


    Prefer create_test_run for new MCP clients. Returns a run ID you can pass

    to get_validation_results to check progress.

    If the target app requires sign-in, provide the email and password for a

    test account on *your* app (not your Arga account).

    Optionally request digital twins (comma-separated, e.g. "slack,stripe,waterfall").

    Optionally provide repo (owner/repo format) and branch to enable diff-aware

    test planning.'
- name: get_validation_results
  description: 'Legacy alias: get the status and step-by-step results of a validation run.


    Prefer get_test_run for new MCP clients. Poll this only after calling the

    deprecated start_url_validation tool. Terminal statuses are: complete,

    failed, cancelled. Non-terminal: queued, running.


    For non-terminal statuses, returns a short text status message.

    For terminal statuses, returns structured JSON with step-level results,

    pass/fail counts, and a human-readable summary — suitable for machine parsing.'
- name: cancel_validation_run
  description: 'Legacy alias: cancel a validation/environment run.'
- name: cancel_run
  description: 'Cancel a legacy validation/environment run.


    Test-run cancellation is not wired yet; this currently covers sandbox,

    twin, and legacy validation runs backed by the environment runner.'
- name: get_twin_provision_status
  description: Return quickstart twin provision status, URLs, and proxy token (when ready).
- name: reset_twins
  description: 'Reset quickstart twins to their captured baseline seed state (in-place, no VM restart).


    This replays the baseline captured at provision time. For long-lived scenario environments,

    use reseed_scenario_twin_environment instead.'
- name: extend_twins
  description: Extend the TTL of a quickstart twin provision.
- name: teardown_twins
  description: Tear down a quickstart twin provision immediately.
- name: ensure_scenario_twin_environment
  description: 'Create or return the long-lived twin URLs for a saved scenario.


    twins: optional comma-separated twin names. If omitted, uses the scenario''s

    saved twin list.

    public: whether stable `base_url`s should be callable without proxy auth.'
- name: get_scenario_twin_environment
  description: Get status and URLs for a scenario's long-lived twin environment.
- name: reseed_scenario_twin_environment
  description: Reseed a ready long-lived scenario twin environment from its scenario config.
- name: delete_scenario_twin_environment
  description: Tear down a scenario's long-lived twin environment.
- name: list_scenario_twin_environments
  description: List all long-lived scenario twin environments for the authenticated user.
- name: get_twin_catalog
  description: 'List all available digital twin types that can be provisioned.


    Returns the name, label, and kind of each twin.

    Use these names when calling provision_twins or start_url_validation.'
tools_legacy:
- name: start_url_validation
  description: Legacy alias for starting a browser validation run against a deployed URL.
- name: get_validation_results
  description: Get status/results for a validation run or a standalone twin provision run.
- name: cancel_validation_run
  description: Legacy alias that cancels a running validation or environment run.
- name: provision_twins
  description: Legacy alias for starting a standalone twin provision.
- name: cancel_run
  description: Compatibility alias for cancelling legacy validation or environment runs.
